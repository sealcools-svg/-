<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Коттедж Копатыча 🥒</title>

    <style>
        body {
            background: rgb(147, 237, 133)
            }   
        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            border: 1px solid #089e37;
            padding: 35px;
            border-radius: 15px;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .card h2 {
            margin-bottom: 5px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Супер Пупер Огурец 🥒</h1>

    <div class="products">

    <div class="card">
        <img src="https://sun9-58.vkuserphoto.ru/impg/c841530/v841530076/23b2e/fmj5DxIgxBM.jpg?size=520x0&quality=95&sign=41976d8acd2b1f9f70015cabd8465c11">
        <h2>Огурец от Копатыча 🥒</h2>
        <p class="price">1 200₽</p>
        <button>Заказать 🤑</button>
    </div>

    <div class="card">
        <img src="https://здоровое-питание.рф/upload/iblock/e48/73hn14kp3rtpf7j541342hqxweeir3hr/zagruzhennoe-_-2023_05_04T144923.094.jpg">
        <h2>Огурец Обыкновенный 1 кг🥒</h2>
        <p class="price">29 099₽</p>
        <button>Заказать 🤑</button>
    </div>

    <div class="card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRjSlzsMhzWBeRovQi_c0N4bwbwMPVVTe_3o6DDHTihmw&s=10">
        <h2>Огурец Необыкновенный 67 кг🥒</h2>
        <p class="price">670₽</p>
        <button>Заказать 🤑</button>
    </div>

    <div class="card">
        <img src="https://img.povar.ru/mobile/d7/bf/47/0b/roll_s_ogurcom-422565.jpg">
        <h2>Огурец Гниющий 🥒</h2>
        <p class="price">1 000 000₽</p>
        <button>Заказать 🤑</button>
    </div>

    <div class="card">
        <img src="https://rostgroup.ru/uploads/ogurczy_na_podlozhke_gladkie_rost_34e58e4f77.png">
        <h2>Огурец покупной 🥒</h2>
        <p class="price">200₽</p>
        <button>Заказать 🤑</button>
    </div>

    <div class="card">
        <img src="https://biomolecula.ru/media/cache/77/34/77341f121ddab54f61fb25edf8dce19e.png">
        <h2>Огурец Рик🥒</h2>
        <p class="price">670 000₽</p>
        <button>Заказать 🤑</button>
    </div>

    </div>
</body>
</html>
