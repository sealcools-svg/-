<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

    details {
        background: rgb(153, 226, 251);
        margin-bottom: 10px;
        border-radius: 5px;
        color: azure;
    }

    summary {
        padding: 15px;
        cursor: cell;
        font-weight: bold;
    }

    header {
        background: rgb(255, 155, 171);
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    nav {
        display: flex;
        gap: 20px;
    }

    nav a {
        color: azure;
        text-decoration: none;
        padding: 8px;
    }

    nav a:hover {
        background: rgb(105, 244, 105);
    }

    .dropdown {
        position: relative;
    }

    button {
        background: rgb(85, 209, 250);
        color: azure;
        border: none;
        padding: 8px;
        cursor: pointer;
    }

    .dropdown-content {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        background: rgb(240, 26, 61);
        min-width: 150px;
    }

    .dropdown-content a {
        display: block;
        color: yellow;
        padding: 10px;
    }

    .dropdown-content a:hover {
        background:rgb(105, 244, 105);
    }

    .dropdown:hover .dropdown-content {
        display: block;
    }

    #sidebar {
    display: none;
    }

    .open-button {
        display: inline-block;
        background: rgb(175, 166, 234);
        color: azure;
        padding: 12px;
        cursor: pointer;
    }

    .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 250px;
        height: 100%;
        transform: translateX(-100%);
        padding: 25px;
        transition: 0.3s;

        background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #00c6ff, #0072ff);
        background-size: 400% 400%;
        animation: oceanMove 20s ease infinite;
    }

    @keyframes oceanMove {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

    #sidebar:checked ~ .sidebar {
        transform: translateX(0);
    }

    </style>
</head>
<body>

        </p>
    </details>

        </p>

    <details>

<header>
    <nav>
        <a href="#">Мой ТикТок</a>

            <button>Наши спонсоры 🔽</button>
            <di class="dropdown-content">
                <a href="https://ru.wikipedia.org/wiki/%D0%AF%D0%B1%D0%BB%D0%BE%D0%BA%D0%BE">Яблоко</a>
                <a href="https://ru.wikipedia.org/wiki/%D0%9A%D0%B8%D0%BB%D1%8C%D0%BA%D0%B0">Килька</a>

</html>
