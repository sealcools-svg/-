<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeaStore 🌊</title>
</head>
    <style>

        body {
            height: 2000px;
            margin: 0;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            background-image: url(https://files.1mi.media/1960cb82fa189605c211ec7bc81ddc1f9ea12860/c:1920:1080:nowe:0:100/rs:fill:800/e34966a2e61e957109ecb31471772715c4be534d1a84e31b9fec98f40b1a.webp);
        }



        .fixed-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: cyan;
            color: darkblue;
            padding: 10pxw;
            cursor: pointer;
        }

        .sticky-menu {
            position: sticky;
            top: 0;
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTeNyuVW4_NIaxGESFqWHzfyYvrWnWOW8wn9FOMKwrJkSeXip3Wh7QMcQM&s=10);
            color: rgb(230, 239, 232);
            padding: 15px;
        }

        .card {
            position: relative;
            width: 150px;
            border: 1px solid darkcyan;
            padding: 15px;
            color: white;
            margin: 30px;
            background-image: url(https://pifpafgun.ru/upload/iblock/c62/qaxffp0n2mt1i9l8ltxko0gw7tk2kik3.jpg) style="width: 200px; height: auto; background: red; padding: 10px;";
            
        }

        .badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background: red;
            color: white;
            padding: 2px 6px;
        }

    </style>
<body>


    <div class="sticky-menu">Цветы: улица Пушкина, дом Калотушкина Б/3</div>

    <div class="fixed-btn">Чума 🦠</div>

    <div class="card">
        <div class="badge">-67%</div>
        <h3>Покупка защиты от чумы в Иркутске</h3>
    </div>

</body>
</html>
