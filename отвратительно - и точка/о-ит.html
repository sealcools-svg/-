<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
html {
    scroll-behavior: smooth;
    scroll-snap-type: y mandatory;
}

body {
    font-family: fantasy;
    background: rgb(198, 148, 74);
    color: rgba(109, 20, 11, 0.954);
}

section {
    min-height: 100vh;
    scroll-snap-align: start;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
}

a {
    margin-top: 20px;
    padding: 12px;
    background: rgba(216, 77, 12, 0.904);
    color: white;
    border-radius: 20px;
    text-decoration: none;
    transition: 0.3s;
}
.symbols {
    background: rgb(201, 126, 153);
}

.cards {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
    margin-top: 30px;
}

.card {
    width: 100px;
    padding: 25px;
    background: yellow;
    border: 3px solid rgba(255, 166, 0, 0.799);
    border-radius: 15px;
    animation: floating 2s ease-in-out infinite;
}

.card:nth-child(2) {
    animation-delay: 1s;
}

@keyframes floating{
    0%, 100% {
        transform: translateY(0pxx);
    }
    50% {
        transform: translateY(-20px);
    }
}

.ghost {
    position: fixed;
    top: 10%;
    left: -100px;
    font-size: 55px;
    pointer-events: none;
    z-index: 10;
    animation: ghostFly 10s linear infinite;
}

@keyframes ghostFly {
    0% {
        left: -100px;
        transform: translateY(0px) rotate(-10deg);
    }

    25% {
        transform: translateY(40px) rotate(10deg);
    }

    50% {
        transform: translateY(-20px) rotate(-10deg);
    }

    75% {
        transform: translateY(30px) rotate(10deg);
    }

    100% {
        left: 110%;
        transform: translateY(0) rotate(-10deg);
    }
}
    </style>
</head>
<body>
    <div class="ghost">☕</div>

    <section id="home">
        <h1>С Днём гадания на кофейной гуще!</h1>
        <p></p>
        <a href="#about">Узнать больше...</a>
    </section>

    <section id="about">
        <h2>
Вскипит в упрямой турке темный кофе, <br>
По комнате потянется туман. <br>
На тонком и фарфоровом софите <br>
Раскроется таинственный роман.
        </h2>
        <a href="#symbols">Дальше...</a>
    </section>
    
    <section id="symbols">
        <h2>Я не я, пока не выпью кофе!</h2>
        <div class="cards">
            <div class="card">
                ☕
                <p>Тыквенный латте 98℃ без пенки</p>
            </div>
            <div class="card">
                🍵
                <p>Печенька с матчей?</p>
            </div>
        </div>
        <a href="#home">В небеса</a>
    </section>
</body>
</html>
